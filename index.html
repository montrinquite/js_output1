<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Trinq's JavaScript</title>
</head>
<body>

    <h1>JavaScript Output 1</h1>

    <div>

        <label>Insert any positive numbers: <input type="number" id="numberInput" min="0"></label>

    </div>

    <div>

        <button id="insertBttn">Insert</button>
        <button id="clearEntryBttn">Clear Entry</button>

    </div>

    <fieldset>

        <legend>Inserted Numbers</legend>
        <div id="outputList"></div>

    </fieldset>

    <div>

        <button id="clearAllBttn">Clear All</button>
        <button id="totalBttn">Get Total</button>
        <button id="identHLbttn">Identify Highest and Lowest Number</button>
        <label>Sort by:
            <select id="sortSelect">
                <option value="">Please Select</option>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
        </label>

    </div>
    
</body>

<script src="script.js"></script>
</html>
